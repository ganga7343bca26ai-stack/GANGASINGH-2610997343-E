<!DOCTYPE html>
<html>
<head>
    <title>World Map Explorer</title>
</head>
<body>

    <h1>World Map Explorer</h1>
    <p>Click on different regions on the world map to explore country and continent information:</p>

    <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=1000" alt="World Map" usemap="#world-map" width="1000" height="500">

    <map name="world-map">
        <area shape="rect" coords="100,100,300,250" href="https://www.wikipedia.org/wiki/North_America" alt="North America Region" target="_blank">
        <area shape="circle" coords="450,350,70" href="https://www.wikipedia.org/wiki/South_America" alt="South America Region" target="_blank">
        <area shape="poly" coords="500,150,600,120,650,220,530,250" href="https://www.wikipedia.org/wiki/Europe" alt="Europe Region" target="_blank">
        <area shape="rect" coords="500,260,650,420" href="https://www.wikipedia.org/wiki/Africa" alt="Africa Region" target="_blank">
        <area shape="poly" coords="680,120,850,100,900,300,700,280" href="https://www.wikipedia.org/wiki/Asia" alt="Asia Region" target="_blank">
        <area shape="circle" coords="880,420,50" href="https://www.wikipedia.org/wiki/Australia" alt="Australia Region" target="_blank">
        <area shape="default" href="https://www.wikipedia.org/wiki/World_map" alt="Default World Region" target="_blank">
    </map>

</body>
</html>
