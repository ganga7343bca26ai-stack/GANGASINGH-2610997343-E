<!DOCTYPE html>
<html>
<head>
    <title>Readers' Haven – Book Registration & Order Form</title>
</head>
<body>

    <h1 align="center">Readers' Haven – Book Registration & Order Form</h1>

    <form action="#" method="POST" target="_blank">

        <!-- Task 9: Hidden input field -->
        <input type="hidden" name="form_title" value="Readers Haven Book Order">

        <!-- Task 2 & 3: Customer Name, Email, Mobile, Age, Password with placeholders -->
        <p>
            <label for="cust_name">Customer Name:</label><br>
            <input type="text" id="cust_name" name="cust_name" placeholder="Enter your full name" required>
        </p>

        <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </p>

        <p>
            <label for="mobile">Mobile Number:</label><br>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>
        </p>

        <p>
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" placeholder="Enter your age">
        </p>

        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </p>

        <!-- Task 5: Favorite Book Category (Required Drop-down) -->
        <p>
            <label for="category">Favorite Book Category:</label><br>
            <select id="category" name="category" required>
                <option value="">--Select Category--</option>
                <option value="Fiction">Fiction</option>
                <option value="Science">Science</option>
                <option value="History">History</option>
                <option value="Children's Books">Children's Books</option>
            </select>
        </p>

        <!-- Task 6: Book Title and Quantity -->
        <p>
            <label for="book_title">Book Title:</label><br>
            <input type="text" id="book_title" name="book_title" placeholder="Enter book title" required>
        </p>

        <p>
            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required>
        </p>

        <!-- Task 4: Delivery Date and Preferred Delivery Time -->
        <p>
            <label for="delivery_date">Delivery Date:</label><br>
            <input type="date" id="delivery_date" name="delivery_date">
        </p>

        <p>
            <label for="delivery_time">Preferred Delivery Time:</label><br>
            <input type="time" id="delivery_time" name="delivery_time">
        </p>

        <!-- Task 7: Preferred Payment Method (Radio Buttons) -->
        <p>
            <label>Preferred Payment Method:</label><br>
            <input type="radio" id="cod" name="payment" value="Cash on Delivery" required>
            <label for="cod">Cash on Delivery</label>
            <input type="radio" id="online" name="payment" value="Online Payment">
            <label for="online">Online Payment</label>
        </p>

        <!-- Task 8: Additional Services (Checkboxes) -->
        <p>
            <label>Additional Services:</label><br>
            <input type="checkbox" id="gift" name="services" value="Gift Wrapping">
            <label for="gift">Gift Wrapping</label>
            <input type="checkbox" id="bookmark" name="services" value="Bookmark">
            <label for="bookmark">Bookmark</label>
            <input type="checkbox" id="express" name="services" value="Express Delivery">
            <label for="express">Express Delivery</label>
            <input type="checkbox" id="greeting" name="services" value="Greeting Card">
            <label for="greeting">Greeting Card</label>
        </p>

        <!-- Task 11: Delivery Address and Special Instructions -->
        <p>
            <label for="address">Delivery Address & Special Instructions:</label><br>
            <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter delivery address and instructions"></textarea>
        </p>

        <!-- Task 10: File Upload Field with accept attribute -->
        <p>
            <label for="doc">Upload Reference Image/Document:</label><br>
            <input type="file" id="doc" name="doc" accept="image/*,.pdf">
        </p>

        <!-- Task 12: Submit and Reset controls using <button> element -->
        <p>
            <button type="submit">Submit Order</button>
            <button type="reset">Reset Form</button>
        </p>

    </form>

</body>
</html>
